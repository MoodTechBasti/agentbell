[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbell"
version = "1.6.1"
description = "Push notifications and phone approvals for AI coding agents and scripts (ntfy, Telegram, OS fallback)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MoodTechBasti", email = "basti@moodtechsolutions.com" },
]
keywords = [
    "ntfy", "notification", "push-notifications", "cli", "ai-agents",
    "claude-code", "codex", "gemini-cli", "cursor", "opencode", "mcp",
    "approval", "telegram",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MoodTechBasti/agentbell"
Repository = "https://github.com/MoodTechBasti/agentbell"
Changelog = "https://github.com/MoodTechBasti/agentbell/blob/main/CHANGELOG.md"
Issues = "https://github.com/MoodTechBasti/agentbell/issues"

[project.scripts]
agentbell = "agentbell:main"

[tool.setuptools]
py-modules = ["agentbell"]
