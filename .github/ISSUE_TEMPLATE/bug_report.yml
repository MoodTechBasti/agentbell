name: Bug report
description: Report a problem with agentbell
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        This issue is public. Do not paste the output of `agentbell doctor`
        or `agentbell config show`: they contain your topic name, and topic
        names are credentials. Anyone who knows yours can read your
        notifications and answer approvals. Security problems go through
        private vulnerability reporting (see SECURITY.md), not an issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order, if you can reproduce it.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Output of `agentbell --version`
      placeholder: agentbell 1.x.y
    validations:
      required: true

  - type: textarea
    id: verify-output
    attributes:
      label: Output of `agentbell verify`
      description: >
        Run `agentbell verify` (add `--agent <slug>` for the agent involved)
        and paste the output. `verify` is read-only, sends nothing, and does
        not print your topic, server or file paths.
      render: shell
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. macOS 14.5, Ubuntu 22.04, Windows 11, Windows 11 + WSL2
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - pipx install agentbell (from PyPI)
        - pip install agentbell (from PyPI)
        - Git checkout (install.sh, or pip install . from the checkout)
        - Copied agentbell.py by hand
        - Other / not sure
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent involved
      description: Which AI coding agent and version were you using, if any (Claude Code, Codex, Cursor, ...)?
    validations:
      required: false
