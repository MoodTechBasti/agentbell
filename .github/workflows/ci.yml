name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m py_compile agentbell.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Packaging smoke test
        # One install per OS validates the platform-specific console-script path;
        # the full suite still runs across every Python version in the matrix.
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --no-deps .
          agentbell --help

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require full test matrix
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Full test matrix result: $TEST_RESULT"
            exit 1
          fi
